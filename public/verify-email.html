<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <title>Verifiera e-post - Babello</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #D97757 0%, #A8553B 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 460px;
            width: 100%;
            margin: 20px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .icon {
            width: 80px;
            height: 80px;
            background: #D97757;
            border-radius: 20px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        h1 {
            color: #D97757;
            margin-bottom: 16px;
            font-size: 26px;
        }

        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .loading {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 4px solid #f3f4f6;
            border-top-color: #D97757;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn {
            display: inline-block;
            padding: 14px 28px;
            background: #D97757;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 12px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(217, 119, 87, 0.3);
        }

        .success-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-top: 16px;
            text-align: left;
        }

        #success-view, #error-view {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">✉️</div>
        <h1 data-i18n="title">Verifiera din e-post</h1>

        <!-- Loading / verifying state -->
        <div id="loading-view">
            <div class="loading"></div>
            <p data-i18n="verifying">Verifierar din e-post...</p>
        </div>

        <!-- Success view -->
        <div id="success-view">
            <div class="success-icon">✅</div>
            <p data-i18n="successMsg">Din e-postadress har verifierats. Du kan nu använda alla funktioner i Babello-appen.</p>
        </div>

        <!-- Error view -->
        <div id="error-view">
            <div class="error-message">
                <p><strong data-i18n="errorTitle">⚠️ Ogiltig länk</strong></p>
                <p data-i18n="errorMsg">Denna verifieringslänk är ogiltig eller har utgått. Vänligen begär en ny verifieringslänk i appen.</p>
            </div>
            <a href="mailto:babellosupport@gmail.com" class="btn" data-i18n="contactSupport">Kontakta support</a>
        </div>
    </div>

    <script>
        // Production backend API
        const API_BASE = 'https://bt-be-production.up.railway.app';

        const I18N = {
            sv: { title: 'Verifiera din e-post', verifying: 'Verifierar din e-post...', successMsg: 'Din e-postadress har verifierats. Du kan nu använda alla funktioner i Babello-appen.', errorTitle: '⚠️ Ogiltig länk', errorMsg: 'Denna verifieringslänk är ogiltig eller har utgått. Vänligen begär en ny verifieringslänk i appen.', contactSupport: 'Kontakta support' },
            en: { title: 'Verify your email', verifying: 'Verifying your email...', successMsg: 'Your email address has been verified. You can now use all features in the Babello app.', errorTitle: '⚠️ Invalid link', errorMsg: 'This verification link is invalid or has expired. Please request a new verification link in the app.', contactSupport: 'Contact support' },
            de: { title: 'E-Mail bestätigen', verifying: 'Deine E-Mail wird bestätigt...', successMsg: 'Deine E-Mail-Adresse wurde bestätigt. Du kannst jetzt alle Funktionen der Babello-App nutzen.', errorTitle: '⚠️ Ungültiger Link', errorMsg: 'Dieser Bestätigungslink ist ungültig oder abgelaufen. Bitte fordere in der App einen neuen Link an.', contactSupport: 'Support kontaktieren' },
            fr: { title: 'Vérifier votre e-mail', verifying: 'Vérification de votre e-mail...', successMsg: 'Votre adresse e-mail a été vérifiée. Vous pouvez maintenant utiliser toutes les fonctionnalités de l’application Babello.', errorTitle: '⚠️ Lien invalide', errorMsg: 'Ce lien de vérification est invalide ou a expiré. Veuillez en demander un nouveau dans l’application.', contactSupport: 'Contacter le support' },
            es: { title: 'Verifica tu correo', verifying: 'Verificando tu correo...', successMsg: 'Tu dirección de correo se ha verificado. Ahora puedes usar todas las funciones de la app de Babello.', errorTitle: '⚠️ Enlace no válido', errorMsg: 'Este enlace de verificación no es válido o ha caducado. Solicita uno nuevo en la app.', contactSupport: 'Contactar con soporte' }
        };

        const lang = (navigator.language || 'en').slice(0, 2);
        const t = (key) => (I18N[lang] && I18N[lang][key]) || I18N.en[key] || key;

        document.documentElement.lang = I18N[lang] ? lang : 'en';
        document.querySelectorAll('[data-i18n]').forEach((el) => {
            el.textContent = t(el.getAttribute('data-i18n'));
        });

        const token = new URLSearchParams(window.location.search).get('token');

        const show = (id) => {
            ['loading-view', 'success-view', 'error-view'].forEach((v) => {
                document.getElementById(v).style.display = v === id ? 'block' : 'none';
            });
        };

        async function verify() {
            if (!token) { show('error-view'); return; }
            try {
                const res = await fetch(API_BASE + '/api/auth/verify-email', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token })
                });
                const data = await res.json().catch(() => ({}));
                if (res.ok && data.success !== false) {
                    show('success-view');
                } else {
                    show('error-view');
                }
            } catch (err) {
                show('error-view');
            }
        }

        verify();
    </script>
</body>
</html>
