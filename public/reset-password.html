<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <title>Återställ lösenord - Babello</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 460px;
            width: 100%;
            margin: 20px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .icon {
            width: 80px;
            height: 80px;
            background: #9333ea;
            border-radius: 20px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        h1 {
            color: #9333ea;
            margin-bottom: 16px;
            font-size: 26px;
        }

        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .field {
            text-align: left;
            margin-bottom: 16px;
        }

        .field label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #444;
            margin-bottom: 6px;
        }

        .field input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        .field input:focus {
            border-color: #9333ea;
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 14px 28px;
            background: #9333ea;
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
            margin-top: 8px;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(147, 51, 234, 0.3);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 4px solid #f3f4f6;
            border-top-color: #9333ea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-top: 16px;
            font-size: 14px;
            text-align: left;
        }

        .message.error {
            background: #fee;
            color: #c33;
        }

        .message.success {
            background: #ecfdf5;
            color: #047857;
        }

        .success-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        #form-view, #success-view, #error-view {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🔐</div>
        <h1 data-i18n="title">Återställ lösenord</h1>

        <!-- Loading state -->
        <div id="loading-view">
            <div class="loading"></div>
        </div>

        <!-- Reset form -->
        <div id="form-view">
            <p data-i18n="intro">Ange ditt nya lösenord nedan.</p>
            <form id="reset-form">
                <div class="field">
                    <label for="password" data-i18n="newPassword">Nytt lösenord</label>
                    <input type="password" id="password" autocomplete="new-password" minlength="6" required>
                </div>
                <div class="field">
                    <label for="confirm" data-i18n="confirmPassword">Bekräfta lösenord</label>
                    <input type="password" id="confirm" autocomplete="new-password" minlength="6" required>
                </div>
                <button type="submit" class="btn" id="submit-btn" data-i18n="submit">Återställ lösenord</button>
            </form>
            <div id="form-message"></div>
        </div>

        <!-- Success view -->
        <div id="success-view">
            <div class="success-icon">✅</div>
            <p data-i18n="successMsg">Ditt lösenord har återställts. Du kan nu logga in i Babello-appen med ditt nya lösenord.</p>
        </div>

        <!-- Error view (invalid/missing token) -->
        <div id="error-view">
            <div class="message error">
                <p><strong data-i18n="errorTitle">⚠️ Ogiltig länk</strong></p>
                <p data-i18n="errorMsg">Denna återställningslänk är ogiltig eller har utgått. Vänligen begär en ny lösenordsåterställning i appen.</p>
            </div>
            <a href="mailto:babellosupport@gmail.com" class="btn" data-i18n="contactSupport">Kontakta support</a>
        </div>
    </div>

    <script>
        // Production backend API
        const API_BASE = 'https://bt-be-production.up.railway.app';

        // Minimal i18n — matches the app's supported languages, falls back to English.
        const I18N = {
            sv: { title: 'Återställ lösenord', intro: 'Ange ditt nya lösenord nedan.', newPassword: 'Nytt lösenord', confirmPassword: 'Bekräfta lösenord', submit: 'Återställ lösenord', successMsg: 'Ditt lösenord har återställts. Du kan nu logga in i Babello-appen med ditt nya lösenord.', errorTitle: '⚠️ Ogiltig länk', errorMsg: 'Denna återställningslänk är ogiltig eller har utgått. Vänligen begär en ny lösenordsåterställning i appen.', contactSupport: 'Kontakta support', tooShort: 'Lösenordet måste vara minst 6 tecken.', noMatch: 'Lösenorden matchar inte.', generic: 'Något gick fel. Försök igen.', working: 'Återställer...' },
            en: { title: 'Reset password', intro: 'Enter your new password below.', newPassword: 'New password', confirmPassword: 'Confirm password', submit: 'Reset password', successMsg: 'Your password has been reset. You can now log in to the Babello app with your new password.', errorTitle: '⚠️ Invalid link', errorMsg: 'This reset link is invalid or has expired. Please request a new password reset in the app.', contactSupport: 'Contact support', tooShort: 'Password must be at least 6 characters.', noMatch: 'Passwords do not match.', generic: 'Something went wrong. Please try again.', working: 'Resetting...' },
            de: { title: 'Passwort zurücksetzen', intro: 'Gib unten dein neues Passwort ein.', newPassword: 'Neues Passwort', confirmPassword: 'Passwort bestätigen', submit: 'Passwort zurücksetzen', successMsg: 'Dein Passwort wurde zurückgesetzt. Du kannst dich jetzt mit deinem neuen Passwort in der Babello-App anmelden.', errorTitle: '⚠️ Ungültiger Link', errorMsg: 'Dieser Link ist ungültig oder abgelaufen. Bitte fordere in der App ein neues Zurücksetzen an.', contactSupport: 'Support kontaktieren', tooShort: 'Das Passwort muss mindestens 6 Zeichen lang sein.', noMatch: 'Die Passwörter stimmen nicht überein.', generic: 'Etwas ist schiefgelaufen. Bitte versuche es erneut.', working: 'Wird zurückgesetzt...' },
            fr: { title: 'Réinitialiser le mot de passe', intro: 'Saisissez votre nouveau mot de passe ci-dessous.', newPassword: 'Nouveau mot de passe', confirmPassword: 'Confirmer le mot de passe', submit: 'Réinitialiser le mot de passe', successMsg: 'Votre mot de passe a été réinitialisé. Vous pouvez maintenant vous connecter à l’application Babello avec votre nouveau mot de passe.', errorTitle: '⚠️ Lien invalide', errorMsg: 'Ce lien de réinitialisation est invalide ou a expiré. Veuillez demander une nouvelle réinitialisation dans l’application.', contactSupport: 'Contacter le support', tooShort: 'Le mot de passe doit comporter au moins 6 caractères.', noMatch: 'Les mots de passe ne correspondent pas.', generic: 'Une erreur est survenue. Veuillez réessayer.', working: 'Réinitialisation...' },
            es: { title: 'Restablecer contraseña', intro: 'Introduce tu nueva contraseña a continuación.', newPassword: 'Nueva contraseña', confirmPassword: 'Confirmar contraseña', submit: 'Restablecer contraseña', successMsg: 'Tu contraseña se ha restablecido. Ahora puedes iniciar sesión en la app de Babello con tu nueva contraseña.', errorTitle: '⚠️ Enlace no válido', errorMsg: 'Este enlace de restablecimiento no es válido o ha caducado. Solicita un nuevo restablecimiento en la app.', contactSupport: 'Contactar con soporte', tooShort: 'La contraseña debe tener al menos 6 caracteres.', noMatch: 'Las contraseñas no coinciden.', generic: 'Algo salió mal. Inténtalo de nuevo.', working: 'Restableciendo...' }
        };

        const lang = (navigator.language || 'en').slice(0, 2);
        const t = (key) => (I18N[lang] && I18N[lang][key]) || I18N.en[key] || key;

        // Apply translations to static text
        document.documentElement.lang = I18N[lang] ? lang : 'en';
        document.querySelectorAll('[data-i18n]').forEach((el) => {
            el.textContent = t(el.getAttribute('data-i18n'));
        });

        const token = new URLSearchParams(window.location.search).get('token');

        const show = (id) => {
            ['loading-view', 'form-view', 'success-view', 'error-view'].forEach((v) => {
                document.getElementById(v).style.display = v === id ? 'block' : 'none';
            });
        };

        if (!token) {
            show('error-view');
        } else {
            show('form-view');
        }

        const form = document.getElementById('reset-form');
        const msg = document.getElementById('form-message');
        const btn = document.getElementById('submit-btn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            msg.innerHTML = '';
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm').value;

            if (password.length < 6) {
                msg.innerHTML = '<div class="message error">' + t('tooShort') + '</div>';
                return;
            }
            if (password !== confirm) {
                msg.innerHTML = '<div class="message error">' + t('noMatch') + '</div>';
                return;
            }

            btn.disabled = true;
            const originalLabel = btn.textContent;
            btn.textContent = t('working');

            try {
                const res = await fetch(API_BASE + '/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token, newPassword: password })
                });
                const data = await res.json().catch(() => ({}));

                if (res.ok && data.success !== false) {
                    show('success-view');
                } else {
                    msg.innerHTML = '<div class="message error">' + (data.message || t('generic')) + '</div>';
                    btn.disabled = false;
                    btn.textContent = originalLabel;
                }
            } catch (err) {
                msg.innerHTML = '<div class="message error">' + t('generic') + '</div>';
                btn.disabled = false;
                btn.textContent = originalLabel;
            }
        });
    </script>
</body>
</html>
